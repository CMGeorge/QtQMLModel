name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        qt-version: [6.7.2]
        build-type: [Release, Debug]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ../Qt
        key: ${{ runner.os }}-Qt-${{ matrix.qt-version }}
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ matrix.qt-version }}
        cache: true
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }}
    
    - name: Test
      working-directory: build
      run: ctest --output-on-failure --build-config ${{ matrix.build-type }}

  build-mobile:
    strategy:
      matrix:
        include:
          - platform: ios
            os: macos-latest
            qt-target: ios
            qt-arch: ''
            cmake-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          - platform: android-arm64
            os: ubuntu-latest
            qt-target: android
            qt-arch: android_arm64_v8a
            cmake-args: -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          - platform: android-x86_64
            os: ubuntu-latest  
            qt-target: android
            qt-arch: android_x86_64
            cmake-args: -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-24
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Setup Android NDK (Android only)
      if: startsWith(matrix.platform, 'android')
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: ../Qt
        key: ${{ runner.os }}-Qt-6.7.2-${{ matrix.qt-target }}-${{ matrix.qt-arch }}
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.2'
        target: ${{ matrix.qt-target }}
        arch: ${{ matrix.qt-arch }}
        cache: true
    
    - name: Install Qt Desktop (for cross-compilation)
      if: matrix.qt-target != 'desktop'
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.2'
        target: desktop
        arch: linux_gcc_64
        cache: true
        dir: ${{ github.workspace }}/Qt-Desktop
        install-deps: 'true'

    - name: Debug Qt installation paths
      run: |
        echo "Current Qt6_DIR: $Qt6_DIR"
        echo "Contents of Qt-Desktop:"
        find ${{ github.workspace }}/Qt-Desktop -type d -maxdepth 3 | head -20
        echo "Contents of Qt installation:"
        find ${{ github.workspace }}/Qt -type d -maxdepth 3 | head -20

    - name: Configure CMake for ${{ matrix.platform }}
      run: |
        # Set QT_HOST_PATH for cross-compilation
        if [[ "${{ matrix.platform }}" == android* ]] || [[ "${{ matrix.platform }}" == "ios" ]]; then
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export QT_HOST_PATH="${{ github.workspace }}/Qt-Desktop/6.7.2/clang_64"
          else
            export QT_HOST_PATH="${{ github.workspace }}/Qt-Desktop/6.7.2/gcc_64"
          fi
          echo "Using QT_HOST_PATH: $QT_HOST_PATH"
          echo "Qt6_DIR for mobile build: $Qt6_DIR"
        fi
        
        cmake -B build-${{ matrix.platform }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DQt6_DIR="$Qt6_DIR/lib/cmake/Qt6" \
          ${QT_HOST_PATH:+-DQT_HOST_PATH="$QT_HOST_PATH"} \
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
          ${{ matrix.cmake-args }} \
          -DBUILD_TESTING=OFF

    - name: Build for ${{ matrix.platform }}
      run: cmake --build build-${{ matrix.platform }} --config Release

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.2'
    
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy cppcheck doxygen
    
    - name: Check formatting
      run: |
        find src/ -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run --Werror
    
    - name: Static analysis
      run: |
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        run-clang-tidy -p build src/
    
    - name: Cppcheck
      run: |
        set -e
        echo "Running cppcheck using repository script (no build needed)"
        chmod +x scripts/cppcheck.sh
        ./scripts/cppcheck.sh
    
    - name: Generate documentation
      run: |
        doxygen docs/Doxyfile
        
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/html/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mobile, code-quality]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.2'
    
    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
    
    - name: Package
      run: |
        cd build
        cpack
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.tar.gz
        draft: false
        prerelease: false
