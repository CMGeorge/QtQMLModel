  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # TEMP: Debugging Windows - only depends on build job now
    # needs: [build, build-mobile, code-quality]
    needs: [build]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.2'
    
    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
    
    - name: Package
      run: |
        cd build
        cpack
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.tar.gz
        draft: false
        prerelease: false
